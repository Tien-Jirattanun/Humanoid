controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      # joints:
      #   # Left leg
      #   - JL_hip_y
      #   - JL_hip_r
      #   - JL_hip_p
      #   - JL_knee
      #   - JL_ankle_p
      #   - JL_ankle_r
      #   # Right leg
      #   - JR_hip_y
      #   - JR_hip_r
      #   - JR_hip_p
      #   - JR_knee
      #   - JR_ankle_p
      #   - JR_ankle_r
      # interfaces:
      #   - position
      #   - velocity

joint_state_broadcaster:
  ros__parameters:
    joints:
      # Left leg
      - JL_hip_y
      - JL_hip_r
      - JL_hip_p
      - JL_knee
      - JL_ankle_p
      - JL_ankle_r
      # Right leg
      - JR_hip_y
      - JR_hip_r
      - JR_hip_p
      - JR_knee
      - JR_ankle_p
      - JR_ankle_r
    interfaces:
      - effort
      - position
      - velocity


velocity_controller:
  ros__parameters:
    joints:
      # Left leg
      - JL_hip_y
      - JL_hip_r
      - JL_hip_p
      - JL_knee
      - JL_ankle_p
      - JL_ankle_r
      # Right leg
      - JR_hip_y
      - JR_hip_r
      - JR_hip_p
      - JR_knee
      - JR_ankle_p
      - JR_ankle_r
    command_interfaces:
      - velocity
    state_interfaces:
      - effort
      - velocity 
      - position
