controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      joints:
        # Left leg
        - JL_hip_r
        - JL_hip_p
        - JL_knee
        - JL_ankle_r
        - JL_hip_y
        - JL_ankle_p
        # Right leg
        - JR_hip_r
        - JR_hip_y
        - JR_hip_p
        - JR_knee
        - JR_ankle_r
        - JR_ankle_p
      interfaces:
        - position
        - velocity

velocity_controller:
  ros__parameters:
    joints:
      # Left leg
      - JL_hip_r
      - JL_hip_p
      - JL_knee
      - JL_ankle_r
      - JL_hip_y
      - JL_ankle_p
      # Right leg
      - JR_hip_r
      - JR_hip_y
      - JR_hip_p
      - JR_knee
      - JR_ankle_r
      - JR_ankle_p
    command_interfaces:
      - velocity
    state_interfaces:
      - velocity 
      - position
